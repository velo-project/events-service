basePath: /api/events/v1
definitions:
  services.CancelSubscriptionServiceOutput:
    properties:
      message:
        type: string
      status_code:
        type: integer
    type: object
  services.ConfirmSubscriptionOutput:
    properties:
      message:
        type: string
      status_code:
        type: integer
    type: object
  services.CreateEventServiceOutput:
    properties:
      event_id:
        type: integer
      message:
        type: string
      status_code:
        type: integer
    type: object
  services.GetConfirmationCodeOutput:
    properties:
      code:
        type: string
      message:
        type: string
      status_code:
        type: integer
    type: object
  services.SubscribeEventServiceOutput:
    properties:
      code:
        type: string
      message:
        type: string
      status_code:
        type: integer
    type: object
host: localhost:8080
info:
  contact:
    email: soberkoder@swagger.io

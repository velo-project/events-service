paths:
  /cancel-subscription/{id}:
    post:
      consumes:
      - application/json
      description: Cancel a subscription to an event
      parameters:
      - description: Event ID
        in: path
        name: id
        required: true
        type: integer
      - description: User ID
        in: header
        name: userId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/services.CancelSubscriptionServiceOutput'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/services.CancelSubscriptionServiceOutput'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/services.CancelSubscriptionServiceOutput'
      summary: Cancel a subscription to an event
      tags:
      - events
  /confirm-subscription/{id}:
    post:
      consumes:
      - application/json
      description: Confirm a subscription to an event
      parameters:
      - description: Event ID
        in: path
        name: id
        required: true
        type: integer
      - description: User ID
        in: header
        name: userId
        required: true
        type: integer
      - description: Confirmation code
        in: body
        name: code
        required: true
        schema:
          properties:
            code:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/services.ConfirmSubscriptionOutput'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/services.ConfirmSubscriptionOutput'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/services.ConfirmSubscriptionOutput'
      summary: Confirm a subscription to an event
      tags:
      - events
  /confirmation-code/{id}:
    get:
      consumes:
      - application/json
      description: Get a confirmation code for an event
      parameters:
      - description: Event ID
        in: path
        name: id
        required: true
        type: integer
      - description: User ID
        in: header
        name: userId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/services.GetConfirmationCodeOutput'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/services.GetConfirmationCodeOutput'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/services.GetConfirmationCodeOutput'
      summary: Get a confirmation code for an event
      tags:
      - events
  /create:
    post:
      consumes:
      - multipart/form-data
      description: Create an event
      parameters:
      - description: Event image
        in: formData
        name: image
        required: true
        type: file
      - description: Event name
        in: formData
        name: name
        required: true
        type: string
      - description: Event description
        in: formData
        name: description
        type: string
      - description: Event date
        in: formData
        name: date
        required: true
        type: string
      - description: Event location
        in: formData
        name: location
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/services.CreateEventServiceOutput'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/services.CreateEventServiceOutput'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/services.CreateEventServiceOutput'
      summary: Create an event
      tags:
      - events
  /subscribe/{id}:
    post:
      consumes:
      - application/json
      description: Subscribe to an event
      parameters:
      - description: Event ID
        in: path
        name: id
        required: true
        type: integer
      - description: User ID
        in: header
        name: userId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/services.SubscribeEventServiceOutput'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/services.SubscribeEventServiceOutput'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/services.SubscribeEventServiceOutput'
      summary: Subscribe to an event
      tags:
      - events
swagger: "2.0"
